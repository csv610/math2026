<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="600" height="400" fill="#1a1a2e" rx="8"/>
  <text x="300" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">Sphere Packing: From Kepler to Viazovska</text>
  
  <!-- 1D packing -->
  <text x="80" y="60" text-anchor="middle" fill="#aaa" font-size="11">dim 1</text>
  <circle cx="50" cy="100" r="12" fill="none" stroke="#16c79a" stroke-width="2"/>
  <circle cx="74" cy="100" r="12" fill="none" stroke="#16c79a" stroke-width="2"/>
  <circle cx="98" cy="100" r="12" fill="none" stroke="#16c79a" stroke-width="2"/>
  <circle cx="122" cy="100" r="12" fill="none" stroke="#16c79a" stroke-width="2"/>
  <circle cx="146" cy="100" r="12" fill="none" stroke="#16c79a" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" fill="#16c79a" font-size="10">100%</text>
  
  <!-- 2D hexagonal -->
  <text x="220" y="60" text-anchor="middle" fill="#aaa" font-size="11">dim 2</text>
  <circle cx="200" cy="100" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <circle cx="224" cy="86" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <circle cx="224" cy="114" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <circle cx="176" cy="86" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <circle cx="176" cy="114" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <circle cx="248" cy="86" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <circle cx="248" cy="114" r="12" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <text x="212" y="145" text-anchor="middle" fill="#53a8b9" font-size="10">90.69%</text>
  
  <!-- 3D FCC (Kepler) -->
  <text x="360" y="60" text-anchor="middle" fill="#aaa" font-size="11">dim 3</text>
  <circle cx="340" cy="100" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="364" cy="86" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="364" cy="114" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="316" cy="86" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="316" cy="114" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="388" cy="86" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="388" cy="114" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <circle cx="340" cy="100" r="12" fill="none" stroke="#f0a500" stroke-width="2"/>
  <text x="352" y="145" text-anchor="middle" fill="#f0a500" font-size="10">74.05%</text>
  
  <!-- dim 8 E8 (Viazovska) -->
  <text x="490" y="60" text-anchor="middle" fill="#aaa" font-size="11">dim 8</text>
  <circle cx="470" cy="100" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="494" cy="86" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="494" cy="114" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="446" cy="86" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="446" cy="114" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="518" cy="86" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="518" cy="114" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="470" cy="100" r="12" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <text x="482" y="145" text-anchor="middle" fill="#e94560" font-size="10">25.37%</text>
  <text x="482" y="158" text-anchor="middle" fill="#e94560" font-size="9">VIAZOVSka 2016</text>
  
  <!-- dim 24 Leech (Viazovska) -->
  <text x="490" y="185" text-anchor="middle" fill="#aaa" font-size="11">dim 24</text>
  <text x="490" y="205" text-anchor="middle" fill="#e94560" font-size="10">Leech Lattice</text>
  <text x="490" y="220" text-anchor="middle" fill="#e94560" font-size="10">VIAZOVSka + team</text>
  <text x="490" y="235" text-anchor="middle" fill="#e94560" font-size="10">2016</text>
  <text x="490" y="250" text-anchor="middle" fill="#aaa" font-size="9">~0.00193 density</text>
  
  <!-- Divider line -->
  <line x1="160" y1="270" x2="440" y2="270" stroke="#333" stroke-width="1"/>
  
  <!-- Key insight -->
  <text x="300" y="295" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold">The Cohn--Kenyon Method</text>
  <text x="300" y="315" text-anchor="middle" fill="#53a8b9" font-size="11">Construct an auxiliary function f with:</text>
  <text x="300" y="333" text-anchor="middle" fill="#53a8b9" font-size="11">f(x) ≤ 0 for ||x|| ≥ 1  AND  f-hat(xi) ≤ 0 for 0 &lt; ||xi|| ≤ 1</text>
  <text x="300" y="355" text-anchor="middle" fill="#16c79a" font-size="12">Viazovska: f is built from modular forms!</text>
  <text x="300" y="372" text-anchor="middle" fill="#aaa" font-size="10">This exact construction works only in dim 8 and 24</text>
</svg>
