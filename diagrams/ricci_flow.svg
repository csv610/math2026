<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <!-- Title -->
  <rect x="0" y="0" width="600" height="400" fill="#1a1a2e" rx="8"/>
  <text x="300" y="35" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Ricci Flow on a 3-Manifold</text>
  
  <!-- Initial rough manifold -->
  <ellipse cx="150" cy="180" rx="80" ry="60" fill="none" stroke="#e94560" stroke-width="2" transform="rotate(-15 150 180)"/>
  <path d="M100 150 Q130 120 160 145 Q180 125 200 155 Q210 170 190 195 Q170 210 140 200 Q110 210 100 185 Z" fill="none" stroke="#e94560" stroke-width="2"/>
  <text x="150" y="270" text-anchor="middle" fill="#aaa" font-size="12">Initial Manifold</text>
  <text x="150" y="285" text-anchor="middle" fill="#aaa" font-size="10">(Irregular Shape)</text>
  
  <!-- Arrow -->
  <line x1="230" y1="180" x2="310" y2="180" stroke="#0f3460" stroke-width="3" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f3460"/>
    </marker>
  </defs>
  <text x="270" y="168" text-anchor="middle" fill="#53a8b9" font-size="11">Ricci Flow</text>
  <text x="270" y="182" text-anchor="middle" fill="#53a8b9" font-size="9">∂g/∂t = −2R</text>
  
  <!-- Intermediate state -->
  <ellipse cx="400" cy="180" rx="65" ry="50" fill="none" stroke="#53a8b9" stroke-width="2" transform="rotate(-5 400 180)"/>
  <path d="M350 160 Q370 135 395 150 Q415 140 430 160 Q440 175 425 195 Q405 205 380 200 Q360 200 350 180 Z" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" fill="#aaa" font-size="12">Intermediate</text>
  <text x="400" y="275" text-anchor="middle" fill="#aaa" font-size="10">(Smoothing Out)</text>
  
  <!-- Final sphere -->
  <circle cx="400" cy="340" r="30" fill="none" stroke="#16c79a" stroke-width="2.5"/>
  <text x="400" y="390" text-anchor="middle" fill="#aaa" font-size="12">Final State</text>
  <text x="400" y="400" text-anchor="middle" fill="#aaa" font-size="10">S³ (if simply connected)</text>
  
  <!-- Curvature arrows -->
  <path d="M130 170 Q140 160 155 165" fill="none" stroke="#e94560" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  <defs>
    <marker id="arrowhead2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94560"/>
    </marker>
  </defs>
  <text x="125" y="155" fill="#e94560" font-size="9">high curv.</text>
  
  <path d="M385 170 Q390 160 400 165" fill="none" stroke="#53a8b9" stroke-width="1.5" marker-end="url(#arrowhead2)"/>
  <text x="370" y="155" fill="#53a8b9" font-size="9">reduced</text>
  
  <text x="395" y="335" fill="#16c79a" font-size="9">constant</text>
  <text x="395" y="347" fill="#16c79a" font-size="9">curvature</text>
  
  <!-- Key equation box -->
  <rect x="430" y="40" width="155" height="80" fill="#16213e" stroke="#0f3460" stroke-width="1.5" rx="5"/>
  <text x="507" y="58" text-anchor="middle" fill="#e0e0e0" font-size="11" font-weight="bold">Key Equation</text>
  <text x="507" y="78" text-anchor="middle" fill="#53a8b9" font-size="14" font-family="serif">∂g_ij/∂t = −2R_ij</text>
  <text x="507" y="98" text-anchor="middle" fill="#aaa" font-size="9">Ricci tensor drives</text>
  <text x="507" y="110" text-anchor="middle" fill="#aaa" font-size="9">the smoothing</text>
</svg>
