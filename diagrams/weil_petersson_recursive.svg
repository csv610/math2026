<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="600" height="400" fill="#1a1a2e" rx="8"/>
  <text x="300" y="30" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Weil--Petersson Volumes</text>
  <text x="300" y="55" text-anchor="middle" fill="#cccccc" font-size="12">Recursive Formula</text>
  
  <!-- Moduli space visualization -->
  <ellipse cx="300" cy="200" rx="150" ry="100" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="300" y="205" text-anchor="middle" fill="#4a90d9" font-size="14">Moduli Space M(g,n)</text>
  
  <!-- Recursive structure -->
  <circle cx="180" cy="150" r="40" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" fill="#e94560" font-size="11">(g-1, n+2)</text>
  <text x="180" y="160" text-anchor="middle" fill="#e94560" font-size="10">split</text>
  
  <circle cx="420" cy="150" r="40" fill="#16213e" stroke="#e94560" stroke-width="2"/>
  <text x="420" y="145" text-anchor="middle" fill="#e94560" font-size="11">(g, n+1)</text>
  <text x="420" y="160" text-anchor="middle" fill="#e94560" font-size="10">split</text>
  
  <circle cx="300" cy="280" r="40" fill="#16213e" stroke="#0f3460" stroke-width="2"/>
  <text x="300" y="275" text-anchor="middle" fill="#0f3460" font-size="11">(g1, n1)</text>
  <text x="300" y="290" text-anchor="middle" fill="#0f3460" font-size="10">+ (g2, n2)</text>
  
  <!-- Arrows showing recursion -->
  <line x1="220" y1="150" x2="260" y2="180" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="380" y1="150" x2="340" y2="180" stroke="#4a90d9" stroke-width="1.5"/>
  <line x1="300" y1="240" x2="300" y2="230" stroke="#4a90d9" stroke-width="1.5"/>
  
  <!-- Formula -->
  <rect x="100" y="340" width="400" height="40" fill="#0f3460" rx="5"/>
  <text x="300" y="365" text-anchor="middle" fill="#ffffff" font-size="13">V(g,n) = sum of products V(g_i, n_i)</text>
</svg>
