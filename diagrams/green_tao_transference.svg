<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="600" height="400" fill="#1a1a2e" rx="8"/>
  <text x="300" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">Green--Tao Theorem: Transference Principle</text>
  
  <!-- Dense set -->
  <text x="150" y="70" text-anchor="middle" fill="#16c79a" font-size="12" font-weight="bold">Dense Set A</text>
  <rect x="50" y="80" width="200" height="120" fill="#16213e" stroke="#16c79a" stroke-width="1.5" rx="5"/>
  <!-- Dots representing dense set -->
  <circle cx="80" cy="110" r="3" fill="#16c79a"/>
  <circle cx="100" cy="105" r="3" fill="#16c79a"/>
  <circle cx="120" cy="115" r="3" fill="#16c79a"/>
  <circle cx="140" cy="100" r="3" fill="#16c79a"/>
  <circle cx="160" cy="112" r="3" fill="#16c79a"/>
  <circle cx="180" cy="108" r="3" fill="#16c79a"/>
  <circle cx="200" cy="118" r="3" fill="#16c79a"/>
  <circle cx="90" cy="140" r="3" fill="#16c79a"/>
  <circle cx="110" cy="135" r="3" fill="#16c79a"/>
  <circle cx="130" cy="142" r="3" fill="#16c79a"/>
  <circle cx="150" cy="138" r="3" fill="#16c79a"/>
  <circle cx="170" cy="145" r="3" fill="#16c79a"/>
  <circle cx="190" cy="136" r="3" fill="#16c79a"/>
  <circle cx="100" cy="165" r="3" fill="#16c79a"/>
  <circle cx="120" cy="160" r="3" fill="#16c79a"/>
  <circle cx="140" cy="168" r="3" fill="#16c79a"/>
  <circle cx="160" cy="162" r="3" fill="#16c79a"/>
  <circle cx="180" cy="170" r="3" fill="#16c79a"/>
  <text x="150" y="195" text-anchor="middle" fill="#aaa" font-size="9">Density: |A| ≥ δN</text>
  
  <!-- Arrow: domination -->
  <line x1="260" y1="140" x2="340" y2="140" stroke="#f0a500" stroke-width="2.5" marker-end="url(#ah1)"/>
  <defs>
    <marker id="ah1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f0a500"/>
    </marker>
  </defs>
  <text x="300" y="130" text-anchor="middle" fill="#f0a500" font-size="10" font-weight="bold">dominated by</text>
  <text x="300" y="145" text-anchor="middle" fill="#f0a500" font-size="9">pseudorandom ν</text>
  
  <!-- Pseudorandom set -->
  <text x="450" y="70" text-anchor="middle" fill="#53a8b9" font-size="12" font-weight="bold">Pseudorandom ν</text>
  <rect x="350" y="80" width="200" height="120" fill="#16213e" stroke="#53a8b9" stroke-width="1.5" rx="5"/>
  <!-- Sparse dots representing pseudorandom measure -->
  <circle cx="380" cy="108" r="3" fill="#53a8b9"/>
  <circle cx="400" cy="102" r="3" fill="#53a8b9"/>
  <circle cx="420" cy="112" r="3" fill="#53a8b9"/>
  <circle cx="440" cy="100" r="3" fill="#53a8b9"/>
  <circle cx="460" cy="110" r="3" fill="#53a8b9"/>
  <circle cx="480" cy="105" r="3" fill="#53a8b9"/>
  <circle cx="500" cy="115" r="3" fill="#53a8b9"/>
  <circle cx="390" cy="138" r="3" fill="#53a8b9"/>
  <circle cx="410" cy="132" r="3" fill="#53a8b9"/>
  <circle cx="430" cy="140" r="3" fill="#53a8b9"/>
  <circle cx="450" cy="135" r="3" fill="#53a8b9"/>
  <circle cx="470" cy="142" r="3" fill="#53a8b9"/>
  <circle cx="490" cy="136" r="3" fill="#53a8b9"/>
  <circle cx="400" cy="165" r="3" fill="#53a8b9"/>
  <circle cx="420" cy="160" r="3" fill="#53a8b9"/>
  <circle cx="440" cy="168" r="3" fill="#53a8b9"/>
  <circle cx="460" cy="162" r="3" fill="#53a8b9"/>
  <circle cx="480" cy="170" r="3" fill="#53a8b9"/>
  <text x="450" y="195" text-anchor="middle" fill="#aaa" font-size="9">Pseudorandom + positive density</text>
  
  <!-- Arrow: Szemeredi transfers -->
  <line x1="450" y1="210" x2="450" y2="245" stroke="#e94560" stroke-width="2" marker-end="url(#ah2)"/>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
  </defs>
  <text x="510" y="232" text-anchor="start" fill="#e94560" font-size="10">Szemerédi transfers</text>
  
  <!-- Bottom box: primes -->
  <rect x="100" y="260" width="400" height="120" fill="#16213e" stroke="#0f3460" stroke-width="2" rx="8"/>
  <text x="300" y="288" text-anchor="middle" fill="#e0e0e0" font-size="13" font-weight="bold">The Primes</text>
  
  <!-- Primes as subset of pseudorandom -->
  <text x="300" y="310" text-anchor="middle" fill="#53a8b9" font-size="11">Primes ⊂ pseudorandom set ν (with positive relative density)</text>
  
  <!-- Arrow from pseudorandom to primes -->
  <line x1="300" y1="320" x2="300" y2="340" stroke="#16c79a" stroke-width="2" marker-end="url(#ah3)"/>
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16c79a"/>
    </marker>
  </defs>
  <text x="300" y="360" text-anchor="middle" fill="#16c79a" font-size="12" font-weight="bold">Primes contain arbitrarily long APs!</text>
</svg>
