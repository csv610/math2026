<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="600" height="400" fill="#1a1a2e" rx="8"/>
  <text x="300" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">The Langlands Correspondence</text>
  
  <!-- Left side: Galois Representations -->
  <rect x="30" y="50" width="240" height="280" fill="#16213e" stroke="#0f3460" stroke-width="2" rx="8"/>
  <text x="150" y="78" text-anchor="middle" fill="#e94560" font-size="14" font-weight="bold">Galois Side</text>
  
  <!-- Galois group -->
  <circle cx="150" cy="120" r="30" fill="none" stroke="#e94560" stroke-width="2"/>
  <text x="150" y="116" text-anchor="middle" fill="#e94560" font-size="11" font-weight="bold">Gal</text>
  <text x="150" y="130" text-anchor="middle" fill="#e94560" font-size="11" font-weight="bold">F</text>
  
  <!-- Representations -->
  <rect x="90" y="165" width="120" height="50" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5" rx="4"/>
  <text x="150" y="185" text-anchor="middle" fill="#e0e0e0" font-size="10">ρ: Gal → GLₙ(Q̄ℓ)</text>
  <text x="150" y="202" text-anchor="middle" fill="#aaa" font-size="9">continuous rep'n</text>
  
  <!-- L-function -->
  <rect x="90" y="225" width="120" height="40" fill="#1a1a2e" stroke="#e94560" stroke-width="1.5" rx="4"/>
  <text x="150" y="243" text-anchor="middle" fill="#e0e0e0" font-size="10">L(s, ρ) = Π (1 - aᵥ pᵥ⁻ˢ)⁻¹</text>
  <text x="150" y="257" text-anchor="middle" fill="#aaa" font-size="9">Euler product</text>
  
  <!-- Right side: Automorphic Forms -->
  <rect x="330" y="50" width="240" height="280" fill="#16213e" stroke="#0f3460" stroke-width="2" rx="8"/>
  <text x="450" y="78" text-anchor="middle" fill="#53a8b9" font-size="14" font-weight="bold">Automorphic Side</text>
  
  <!-- Adelic group -->
  <circle cx="450" cy="120" r="30" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <text x="450" y="116" text-anchor="middle" fill="#53a8b9" font-size="11" font-weight="bold">GLₙ</text>
  <text x="450" y="130" text-anchor="middle" fill="#53a8b9" font-size="11" font-weight="bold">(A_F)</text>
  
  <!-- Automorphic rep -->
  <rect x="390" y="165" width="120" height="50" fill="#1a1a2e" stroke="#53a8b9" stroke-width="1.5" rx="4"/>
  <text x="450" y="185" text-anchor="middle" fill="#e0e0e0" font-size="10">π: automorphic rep</text>
  <text x="450" y="202" text-anchor="middle" fill="#aaa" font-size="9">of GLₙ(A_F)</text>
  
  <!-- L-function -->
  <rect x="390" y="225" width="120" height="40" fill="#1a1a2e" stroke="#53a8b9" stroke-width="1.5" rx="4"/>
  <text x="450" y="243" text-anchor="middle" fill="#e0e0e0" font-size="10">L(s, π) = Π (1 - aᵥ pᵥ⁻ˢ)⁻¹</text>
  <text x="450" y="257" text-anchor="middle" fill="#aaa" font-size="9">Euler product</text>
  
  <!-- Central arrow: Correspondence -->
  <line x1="275" y1="190" x2="325" y2="190" stroke="#f0a500" stroke-width="3"/>
  <line x1="275" y1="245" x2="325" y2="245" stroke="#f0a500" stroke-width="3"/>
  <text x="300" y="218" text-anchor="middle" fill="#f0a500" font-size="12" font-weight="bold">bijection</text>
  
  <!-- Bottom: Function field context -->
  <rect x="60" y="340" width="480" height="45" fill="#16213e" stroke="#0f3460" stroke-width="1.5" rx="5"/>
  <text x="300" y="360" text-anchor="middle" fill="#e0e0e0" font-size="11">Function Field Case (proved)</text>
  <text x="300" y="378" text-anchor="middle" fill="#16c79a" font-size="10">Drinfeld (1981, n=2) → Lafforgue (2002, all n) → Ngo (2009, Fundamental Lemma)</text>
</svg>
