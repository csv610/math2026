<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="600" height="400" fill="#1a1a2e" rx="8"/>
  <text x="300" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">Elliptic Curves and Modular Forms</text>
  
  <!-- Elliptic curve visualization -->
  <text x="150" y="65" text-anchor="middle" fill="#16c79a" font-size="13" font-weight="bold">Elliptic Curve</text>
  <rect x="50" y="75" width="200" height="200" fill="#16213e" stroke="#0f3460" stroke-width="1" rx="5"/>
  
  <!-- Curve y^2 = x^3 - x -->
  <path d="M80 200 Q100 120 130 100 Q150 90 170 100 Q200 120 220 200" fill="none" stroke="#16c79a" stroke-width="2.5"/>
  <path d="M130 100 Q140 110 150 120 Q160 110 170 100" fill="none" stroke="#16c79a" stroke-width="2.5"/>
  <!-- Points on curve -->
  <circle cx="100" cy="160" r="4" fill="#e94560"/>
  <circle cx="150" cy="120" r="4" fill="#e94560"/>
  <circle cx="200" cy="160" r="4" fill="#e94560"/>
  <circle cx="150" cy="200" r="4" fill="#f0a500"/>
  <text x="150" y="225" text-anchor="middle" fill="#aaa" font-size="9">y^2 = x^3 - x</text>
  <text x="150" y="240" text-anchor="middle" fill="#aaa" font-size="9">Group Law: P + Q + R = 0</text>
  
  <!-- Modular form visualization -->
  <text x="450" y="65" text-anchor="middle" fill="#53a8b9" font-size="13" font-weight="bold">Modular Form</text>
  <rect x="350" y="75" width="200" height="200" fill="#16213e" stroke="#0f3460" stroke-width="1" rx="5"/>
  
  <!-- Upper half plane -->
  <line x1="360" y1="160" x2="540" y2="160" stroke="#53a8b9" stroke-width="1"/>
  <text x="545" y="163" fill="#53a8b9" font-size="9">Im(z) = 0</text>
  <text x="355" y="100" fill="#53a8b9" font-size="9">Im(z) → ∞</text>
  <!-- Upper half plane shading -->
  <rect x="360" y="80" width="180" height="80" fill="#53a8b9" opacity="0.05"/>
  
  <!-- Grid lines -->
  <line x1="400" y1="80" x2="400" y2="160" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  <line x1="440" y1="80" x2="440" y2="160" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  <line x1="480" y1="80" x2="480" y2="160" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  <line x1="520" y1="80" x2="520" y2="160" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  <line x1="360" y1="100" x2="540" y2="100" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  <line x1="360" y1="120" x2="540" y2="120" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  <line x1="360" y1="140" x2="540" y2="140" stroke="#53a8b9" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Modular form graph -->
  <path d="M360 90 Q400 85 440 95 Q480 105 520 90" fill="none" stroke="#53a8b9" stroke-width="2"/>
  <text x="450" y="175" text-anchor="middle" fill="#aaa" font-size="9">f((az+b)/(cz+d)) = (cz+d)^k f(z)</text>
  <text x="450" y="190" text-anchor="middle" fill="#aaa" font-size="9">q-expansion: f(z) = Σ aₙqⁿ</text>
  
  <!-- Connection arrow -->
  <line x1="255" y1="175" x2="345" y2="175" stroke="#e94560" stroke-width="2.5" marker-end="url(#ah)"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560"/>
    </marker>
  </defs>
  <text x="300" y="168" text-anchor="middle" fill="#e94560" font-size="10" font-weight="bold">Modularity</text>
  <text x="300" y="182" text-anchor="middle" fill="#e94560" font-size="9">L(E,s) = L(f,s)</text>
  
  <!-- Bottom box -->
  <rect x="80" y="290" width="440" height="90" fill="#16213e" stroke="#0f3460" stroke-width="1.5" rx="5"/>
  <text x="300" y="312" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">Wiles's Theorem (1995)</text>
  <text x="300" y="332" text-anchor="middle" fill="#53a8b9" font-size="11">Every semistable elliptic curve over Q is modular.</text>
  <text x="300" y="350" text-anchor="middle" fill="#16c79a" font-size="11">This implies Fermat's Last Theorem (via Ribet's Theorem).</text>
  <text x="300" y="368" text-anchor="middle" fill="#aaa" font-size="10">Proof: Galois representations → deformation theory → R = T</text>
  <text x="300" y="383" text-anchor="middle" fill="#aaa" font-size="10">The Taniyama-Shimura-Weil conjecture was proved for semistable curves.</text>
</svg>
